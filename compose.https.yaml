# Public HTTPS variant: Caddy receives web traffic and forwards it to the frontend.
# No training database is hosted by either container.
services:
  too-many-watts:
    image: ghcr.io/tomvlf/too-many-watts:latest
    restart: unless-stopped
    # Available to Caddy on the Compose network, not published as a host port.
    expose:
      - "8080"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 64

  caddy:
    image: caddy:2@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # Permit listening on normal HTTP/HTTPS ports, without all other capabilities.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 128
    depends_on:
      - too-many-watts
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keep certificate/configuration state across container replacements.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
