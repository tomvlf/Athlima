# GitHub runs this release workflow on the configured branch/tag pushes.
# It publishes website images, not users' local training data.
name: Publish Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]

# Read source and publish a package using GitHub's temporary workflow token.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Label default-branch images as latest and release images with their Git tag.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tomvlf/athlima
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # Build with the Dockerfile and embed a traceable build number/source revision.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATHLIMA_BUILD_VERSION=build-${{ github.run_number }}.${{ github.run_attempt }}
            ATHLIMA_BUILD_REVISION=${{ github.sha }}
