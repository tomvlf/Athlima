# GitHub runs this release workflow on the configured branch/tag pushes.
# It publishes website images, not users' local training data.
name: Publish Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]

# Read source, publish a package and request a short-lived OIDC token for
# keyless image signing. The token is only used by the signing step.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs
      # with package-write permission. Dependabot proposes SHA updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Label default-branch images as latest and release images with their Git tag.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/tomvlf/athlima
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # Build with the Dockerfile and embed a traceable build number/source revision.
      # Provenance and SBOM attestations let a deployer verify what the image contains.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            ATHLIMA_BUILD_VERSION=build-${{ github.run_number }}.${{ github.run_attempt }}
            ATHLIMA_BUILD_REVISION=${{ github.sha }}

      # Sign the published digest with the workflow's OIDC identity (no long-lived key).
      # Verify with: cosign verify ghcr.io/tomvlf/athlima@<digest>
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/tomvlf/athlima@${DIGEST}"
